name: Build ZCode candidate

on:
  push:
    branches: [ci]

permissions:
  contents: read
  packages: write

concurrency:
  group: zcode-candidate-${{ github.ref }}
  cancel-in-progress: true

env:
  SOURCE_REPOSITORY: xz-dev/zcode-api
  SOURCE_SHA: 1d26630483fe62576fb9d034cffa331ec64cccdf
  IMAGE: ghcr.io/xz-dev/zcode-proxy
  IMAGE_TAG: candidate-1d26630483fe

jobs:
  test:
    name: Type check and tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact product source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ env.SOURCE_SHA }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1"
      - run: bun install --frozen-lockfile
      - run: bun x tsc --noEmit
      - run: bun test

  docker:
    name: Build and publish amd64 image
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact product source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ env.SOURCE_SHA }}
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push exact candidate
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ env.IMAGE_TAG }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ env.SOURCE_REPOSITORY }}
            org.opencontainers.image.revision=${{ env.SOURCE_SHA }}
            org.opencontainers.image.version=${{ env.IMAGE_TAG }}
      - name: Record immutable image
        run: echo '${{ env.IMAGE }}@${{ steps.build.outputs.digest }}' >> "$GITHUB_STEP_SUMMARY"
